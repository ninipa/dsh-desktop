<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DSH Desktop</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        --startup-background: #f8faff;
        --startup-glow: rgba(0, 112, 243, 0.08);
        --startup-track: rgba(0, 0, 0, 0.07);
        --startup-indicator: #111;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        background:
          radial-gradient(circle at 50% 42%, var(--startup-glow), transparent 30%),
          var(--startup-background);
        user-select: none;
      }

      main {
        display: flex;
        align-items: center;
        flex-direction: column;
        text-align: center;
      }

      .mark {
        display: grid;
        place-items: center;
      }

      .mark img {
        width: 56px;
        height: 56px;
      }

      .progress {
        width: 164px;
        height: 3px;
        overflow: hidden;
        margin-top: 24px;
        border-radius: 999px;
        background: var(--startup-track);
      }

      .progress::after {
        width: 52px;
        height: 100%;
        display: block;
        border-radius: inherit;
        background: var(--startup-indicator);
        content: "";
        animation: loading 1.25s ease-in-out infinite;
      }

      @keyframes loading {
        0% {
          transform: translateX(-60px);
        }
        50% {
          transform: translateX(86px);
        }
        100% {
          transform: translateX(172px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .progress::after {
          width: 100%;
          animation: none;
        }
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --startup-background: rgb(21, 21, 23);
          --startup-glow: rgba(65, 118, 230, 0.12);
          --startup-track: rgba(255, 255, 255, 0.09);
          --startup-indicator: rgba(255, 255, 255, 0.88);
        }

        .mark img {
          filter: invert(1);
        }
      }

      .market-card {
        max-width: 340px;
        margin-top: 28px;
        padding: 14px 18px;
        border-radius: 12px;
        text-align: left;
        color: var(--startup-indicator);
        background: rgba(127, 127, 127, 0.08);
        border: 1px solid rgba(127, 127, 127, 0.18);
      }

      .market-card[hidden] {
        display: none;
      }

      .market-title {
        margin: 0 0 6px;
        font-size: 14px;
        font-weight: 600;
      }

      .market-desc {
        margin: 0 0 12px;
        font-size: 12px;
        line-height: 1.5;
        opacity: 0.75;
      }

      .market-actions {
        display: flex;
        gap: 8px;
      }

      .market-actions button {
        flex: 1;
        padding: 6px 10px;
        border: none;
        border-radius: 8px;
        font-size: 12px;
        cursor: pointer;
      }

      .market-actions button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      #market-enable {
        color: var(--startup-background);
        background: var(--startup-indicator);
      }

      #market-skip {
        color: var(--startup-indicator);
        background: transparent;
        border: 1px solid currentColor;
      }

      .market-result {
        margin: 10px 0 0;
        font-size: 12px;
        line-height: 1.5;
        opacity: 0.85;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <main data-startup-screen>
      <div class="mark">
        <img src="../assets/trayTemplate@2x.png" alt="DSH Desktop" />
      </div>
      <div class="progress" id="progress" aria-label="正在启动"></div>
      <div class="market-card" id="market-card" hidden>
        <p class="market-title" data-i18n="marketTitle">启用插件市场？</p>
        <p class="market-desc" data-i18n="marketDesc">安装美化主题与能力扩展插件，装好后重启应用生效。</p>
        <div class="market-actions">
          <button id="market-enable" type="button" data-i18n="marketEnable">启用</button>
          <button id="market-skip" type="button" data-i18n="marketSkip">跳过</button>
        </div>
        <p class="market-result" id="market-result" hidden></p>
      </div>
    </main>
    <script>
      const I18N = {
        marketTitle: { zh: "启用插件市场？", en: "Enable plugin market?" },
        marketDesc: {
          zh: "安装美化主题与能力扩展插件，装好后重启应用生效。",
          en: "Install themes and capability plugins. Restart the app to activate.",
        },
        marketEnable: { zh: "启用", en: "Enable" },
        marketSkip: { zh: "跳过", en: "Skip" },
        marketEnabled: { zh: "已启用，重启应用后生效。", en: "Enabled. Restart the app to activate." },
        marketFailed: { zh: "启用失败：", en: "Enable failed: " },
        marketRestart: { zh: "立即重启", en: "Restart now" },
      }
      const lang = navigator.language.toLowerCase().startsWith("zh") ? "zh" : "en"
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en"
      if (lang !== "zh") {
        document.querySelector("#progress").setAttribute("aria-label", "Starting")
      }
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.dataset.i18n
        if (I18N[key]) el.textContent = I18N[key][lang]
      })

      const shell = window.desktopShell
      if (shell) {
        shell.isMarketEnabled().then((enabled) => {
          if (!enabled) document.querySelector("#market-card")?.removeAttribute("hidden")
        })
        const enableBtn = document.querySelector("#market-enable")
        const skipBtn = document.querySelector("#market-skip")
        const resultEl = document.querySelector("#market-result")
        let skipIsRestart = false

        // One button, one action: a click must never fire both handlers
        // (addEventListener cannot be overridden by assigning onclick).
        skipBtn?.addEventListener("click", () => {
          if (skipIsRestart) shell.restartApp()
          else shell.skipMarket()
        })

        enableBtn?.addEventListener("click", async () => {
          enableBtn.disabled = true
          resultEl.hidden = false
          const res = await shell.installMarket()
          if (res && res.ok) {
            resultEl.textContent = I18N.marketEnabled[lang]
            skipIsRestart = true
            skipBtn.textContent = I18N.marketRestart[lang]
          } else {
            resultEl.textContent = I18N.marketFailed[lang] + ((res && res.output) || "unknown")
            enableBtn.disabled = false
          }
        })
      }
    </script>
  </body>
</html>
