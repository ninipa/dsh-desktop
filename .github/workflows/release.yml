name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Import signing certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          # Workaround for electron-builder #10066: import the p12 into a
          # dedicated keychain and sign via CSC_NAME/CSC_KEYCHAIN. The
          # CSC_LINK path passes the p12 password to set-key-partition-list
          # and hangs on CI; doing it manually avoids that path entirely.
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          echo "$CSC_LINK" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PW" build.keychain
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" build.keychain
          security list-keychains -d user -s build.keychain
          security default-keychain -s build.keychain
          rm -f /tmp/cert.p12
          echo "CSC_KEYCHAIN=build.keychain" >> "$GITHUB_ENV"
      - name: Build and sign
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never --config.mac.notarize=true
        env:
          CSC_NAME: "qianye wu (89937P449J)"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          generate_release_notes: true
